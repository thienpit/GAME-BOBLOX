name: Deploy to Roblox Experience

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Publish Place to Roblox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Deploy Script
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python deploy.py
